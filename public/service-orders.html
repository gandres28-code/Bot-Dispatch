.modal{position:fixed;inset:0;background:rgba(4,13,25,.68);display:none;align-items:center;justify-content:center;padding:15px;z-index:20}.modal.open{display:flex}.panel{width:min(920px,100%);max-height:93vh;overflow:auto;background:var(--card);border-radius:22px;box-shadow:0 30px 90px rgba(0,0,0,.35)}.panel-head{position:sticky;top:0;z-index:2;background:var(--card);display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}.panel-head h2{margin:0}.close{border:0;background:#eef2f6;width:39px;height:39px;border-radius:12px;font-size:20px;cursor:pointer}.form{padding:20px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{margin-bottom:14px}.field label{display:block;font-size:12px;font-weight:900;color:#536174;margin:0 0 6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.field textarea{min-height:78px;resize:vertical}.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:15px}.cat{border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px 6px;font-weight:800;cursor:pointer}.cat.active{background:var(--nav);color:#fff;border-color:var(--nav)}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.product{border:1px solid var(--line);border-radius:13px;padding:11px}.product-name{font-weight:800;min-height:38px}.product small{display:block;color:var(--muted);font-weight:600;margin-top:4px}.product-group{grid-column:1/-1;font-size:12px;font-weight:900;letter-spacing:.08em;color:#667085;margin-top:8px;padding:8px 2px 2px;border-bottom:1px solid var(--line)}.special-card{grid-column:1/-1;border:1px solid #b2ccff;background:#eff4ff;border-radius:14px;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer}.special-card strong{display:block}.special-card small{color:#475467}.hidebed{grid-column:1/-1;display:none;grid-template-columns:repeat(3,1fr);gap:9px;padding:10px;background:#f8faff;border:1px solid #d1e0ff;border-radius:14px}.hidebed.open{display:grid}.counter{display:flex;align-items:center;justify-content:space-between;margin-top:8px;background:#f1f4f8;border-radius:10px}.counter button{border:0;background:transparent;font-size:19px;font-weight:900;width:38px;height:36px;cursor:pointer}.counter span{font-weight:900}.kits{display:flex;gap:8px;overflow:auto;margin:8px 0 15px}.kit{border:1px solid #b2ccff;background:#eff4ff;color:#1849a9;border-radius:12px;padding:10px 12px;font-weight:900;white-space:nowrap;cursor:pointer}.setup-builder{grid-column:1/-1;border:1px solid #b2ccff;background:#f5f8ff;border-radius:16px;padding:15px}.setup-title{font-weight:900;font-size:16px;margin-bottom:10px}.setup-options{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.setup-option{border:1px solid var(--line);background:white;border-radius:12px;padding:12px;font-weight:900;cursor:pointer}.setup-option.active{background:var(--nav);color:white;border-color:var(--nav)}.setup-bed{grid-template-columns:repeat(2,1fr)}.setup-load{width:100%;border:0;border-radius:12px;background:var(--accent);color:white;padding:13px;font-weight:900;cursor:pointer}.setup-note{color:var(--muted);font-size:12px;margin-top:8px}.submit{width:100%;border:0;border-radius:13px;background:var(--accent);color:#fff;padding:14px;font-weight:900;font-size:16px;cursor:pointer}.toast{position:fixed;right:18px;bottom:18px;background:var(--nav);color:#fff;padding:13px 17px;border-radius:12px;display:none;z-index:40}.toast.show{display:block}
@media(max-width:950px){.orders{grid-template-columns:repeat(2,1fr)}.products{grid-template-columns:repeat(2,1fr)}.hidebed{grid-template-columns:repeat(2,1fr)}.cats{grid-template-columns:repeat(3,1fr)}}@media(max-width:620px){.shell{padding:13px}.top{align-items:flex-start}.brand h1{font-size:20px}.brand p{display:none}.create{padding:11px 13px}.stats{grid-template-columns:repeat(2,1fr)}.orders{grid-template-columns:1fr}.toolbar{display:block}.tabs{margin-bottom:9px}.search{width:100%}.grid2{grid-template-columns:1fr}.products{grid-template-columns:1fr 1fr}.cats{grid-template-columns:repeat(2,1fr)}.hidebed{grid-template-columns:1fr 1fr}.panel{max-height:96vh}.form{padding:14px}}

<body>
<div class="shell">
  <header class="top"><div class="brand"><button class="back" id="backBtn" onclick="goBack()">‹</button><div><h1>📦 Service Orders</h1><p>Solicitudes de habitaciones · estilo HotSOS</p></div></div><button class="create" id="createBtn" onclick="openCreate()">＋ Nueva orden</button></header>
  <section class="stats"><div class="stat"><small>Nuevas</small><strong id="sNew">0</strong></div><div class="stat"><small>En progreso</small><strong id="sProgress">0</strong></div><div class="stat"><small>Urgentes activas</small><strong id="sUrgent">0</strong></div><div class="stat"><small>Completadas hoy</small><strong id="sDone">0</strong></div></section>
  <section class="toolbar"><div class="tabs" id="tabs"><button class="tab active" data-status="active">Activas</button><button class="tab" data-status="new">Nuevas</button><button class="tab" data-status="in_progress">En progreso</button><button class="tab" data-status="delivered">Entregadas</button><button class="tab" data-status="completed">Completadas</button><button class="tab" data-status="all">Todas</button></div><input id="search" class="search" placeholder="Buscar habitación..." oninput="render()"></section>
  <main id="orders" class="orders"><div class="empty">Cargando órdenes…</div></main>
</div>
<div id="modal" class="modal" onclick="if(event.target===this)closeCreate()"><div class="panel"><div class="panel-head"><h2>Nueva orden</h2><button class="close" onclick="closeCreate()">×</button></div><form class="form" onsubmit="createOrder(event)">
<div class="grid2"><div class="field"><label>HABITACIÓN</label><input id="room" required placeholder="Ej. 214A" autocomplete="off"></div><div class="field"><label>SOLICITADA POR</label><input id="requestedBy" placeholder="Dispatch / nombre"></div></div>
<div class="field"><label>CATEGORÍA</label><div id="cats" class="cats"></div></div>
<div class="field"><label>ACCESOS RÁPIDOS</label><div class="kits"><button type="button" class="kit" onclick="applyKit('kitchen')">🍽 Kitchen Reset</button><button type="button" class="kit" onclick="applyKit('king')">🛏 King Bed Kit</button><button type="button" class="kit" onclick="applyKit('queen')">🛏 Queen Bed Kit</button><button type="button" class="kit" onclick="applyKit('bath')">🛁 Towel Set</button></div></div>
<div id="products" class="products"></div>
<div class="grid2" style="margin-top:15px"><div class="field"><label>PRIORIDAD</label><select id="priority"><option value="normal">Normal</option><option value="high">High</option><option value="urgent">Urgent</option></select></div><div class="field"><label>ASIGNAR A</label><select id="assignedTo"><option value="Runner" selected>Runner</option><option value="Unassigned">Unassigned</option></select></div></div>
<div class="field"><label>PROGRAMAR PARA</label><input type="datetime-local" id="scheduledFor"></div><div class="field"><label>NOTAS</label><textarea id="notes" placeholder="Ej. Guest requested before check-in"></textarea></div><button class="submit" id="submitBtn">CREATE ORDER</button>
</form></div></div><div id="toast" class="toast"></div>
<script src="/socket.io/socket.io.js"></script>

];
const icons={Kitchen:'🍽',Linen:'🛏',Bathroom:'🛁',Setup:'🧺',Maintenance:'🔧'};
const kits={
 kitchen:{Kitchen:{'Dinner Fork · Tenedor grande':4,'Dinner Knife · Cuchillo de mesa':4,'Teaspoon · Cuchara pequeña':4,'Dinner Plate · Plato grande':4,'Soup / Pasta Bowl · Plato hondo':4,'Water Glass · Vaso de agua':4}},
 king:{Linen:{'King Flat Sheet':1,'King Fitted Sheet':1,'King Duvet Cover':1,'King Marshmallow · Duvet Insert':1,'Pillow':4,'Pillow Case':4,'Pillow Protector':4}},
 queen:{Linen:{'Queen Flat Sheet':1,'Queen Fitted Sheet':1,'Queen Duvet Cover':1,'Queen Marshmallow · Duvet Insert':1,'Pillow':4,'Pillow Case':4,'Pillow Protector':4}},
 bath:{Bathroom:{'Bath Towel · Toalla de baño':4,'Hand Towel · Toalla de manos':2,'Washcloth · Toallita facial':4,'Black Makeup Towel':1,'Bath Mat · Tapete de baño':1}}
};
let orders=[],filter='active',category='Kitchen',qty={},hideBedOpen=false,setupOccupancy='single',setupBed='king';
const employeeName=(localStorage.getItem('employeeName')||'').trim();
const employeeRole=(localStorage.getItem('employeeRole')||'').trim().toLowerCase();
const runnerMode=employeeRole==='runner'||employeeRole==='laundry / activities / runner';
function goBack(){location.href=runnerMode?'/launch':'/app'}
function configureAccess(){
  if(runnerMode){
    document.getElementById('createBtn').style.display='none';
    document.querySelector('.brand p').textContent=employeeName?`Órdenes para ${employeeName}`:'Órdenes asignadas al runner';
  }
}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function toast(msg){const e=document.getElementById('toast');e.textContent=msg;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2500)}
function openCreate(){document.getElementById('modal').classList.add('open');renderCats();renderProducts();setTimeout(()=>room.focus(),50)}function closeCreate(){document.getElementById('modal').classList.remove('open')}
function renderCats(){cats.innerHTML=Object.keys(catalog).map(c=>`<button type="button" class="cat ${c===category?'active':''}" onclick="selectCat('${c}')">${icons[c]} ${c}</button>`).join('')}
function selectCat(c){category=c;renderCats();renderProducts()}
function productCard(item){return `<div class="product"><div class="product-name">${esc(item.name)}<small>${esc(item.detail||'')}</small></div><div class="counter"><button type="button" onclick='changeQty(${JSON.stringify(item.name)},-1)'>−</button><span>${qty[item.name]||0}</span><button type="button" onclick='changeQty(${JSON.stringify(item.name)},1)'>＋</button></div></div>`}
function renderProducts(){
 if(category==='Setup'){
  products.innerHTML=`<div class="setup-builder"><div class="setup-title">1. Selecciona el tipo de setup</div><div class="setup-options">${['single','double','triple'].map(x=>`<button type="button" class="setup-option ${setupOccupancy===x?'active':''}" onclick="selectSetupOccupancy('${x}')">${x==='single'?'Single':x==='double'?'Double':'Triple'}</button>`).join('')}</div><div class="setup-title">2. Selecciona el tamaño de cama</div><div class="setup-options setup-bed">${['king','queen'].map(x=>`<button type="button" class="setup-option ${setupBed===x?'active':''}" onclick="selectSetupBed('${x}')">${x.toUpperCase()}</button>`).join('')}</div><button type="button" class="setup-load" onclick="loadSetupTemplate()">＋ Cargar ${setupOccupancy.toUpperCase()} ${setupBed.toUpperCase()} Setup</button><div class="setup-note">El sistema agregará linen, toallas y kitchen según el setup. Después puedes ajustar cualquier cantidad antes de crear la orden.</div></div>`;
  return;
 }
 let html='',lastGroup='';catalog[category].forEach(item=>{if(item.group!==lastGroup){html+=`<div class="product-group">${esc(item.group)}</div>`;lastGroup=item.group}html+=productCard(item)});if(category==='Linen'){html+=`<button type="button" class="special-card" onclick="toggleHideBed()"><span><strong>🛋 Hide-a-Bed / Sofa Bed</strong><small>Presiona aquí y especifica exactamente qué pieza necesitas</small></span><b>${hideBedOpen?'▲':'▼'}</b></button><div class="hidebed ${hideBedOpen?'open':''}">${hideBedItems.map(productCard).join('')}</div>`}products.innerHTML=html}
function selectSetupOccupancy(value){setupOccupancy=value;renderProducts()}
function selectSetupBed(value){setupBed=value;renderProducts()}
function loadSetupTemplate(){
 const people={single:2,double:4,triple:6}[setupOccupancy];
 const bed=setupBed==='king'?'King':'Queen';
 qty={};
 qty[`${bed} Flat Sheet`]=1;qty[`${bed} Fitted Sheet`]=1;qty[`${bed} Duvet Cover`]=1;qty[`${bed} Marshmallow · Duvet Insert`]=1;qty[`${bed} Mattress Pad`]=1;qty[`${bed} Mattress Protector`]=1;
 qty['Pillow']=people;qty['Pillow Case']=people;qty['Pillow Protector']=people;
 qty['Bath Towel · Toalla de baño']=people;qty['Hand Towel · Toalla de manos']=people;qty['Washcloth · Toallita facial']=people;qty['Black Makeup Towel']=Math.max(1,Math.ceil(people/2));qty['Bath Mat · Tapete de baño']=1;
 ['Dinner Fork · Tenedor grande','Salad / Dessert Fork · Tenedor pequeño','Dinner Knife · Cuchillo de mesa','Teaspoon · Cuchara pequeña','Dinner Plate · Plato grande','Salad Plate · Plato mediano','Soup / Pasta Bowl · Plato hondo','Water Glass · Vaso de agua'].forEach(name=>qty[name]=people);
 toast(`${setupOccupancy.toUpperCase()} ${bed.toUpperCase()} setup cargado`);
 category='Linen';renderCats();renderProducts();
}
function toggleHideBed(){hideBedOpen=!hideBedOpen;renderProducts()}
function changeQty(name,d){qty[name]=Math.max(0,(qty[name]||0)+d);renderProducts()}
function applyKit(k){qty={};const groups=kits[k];Object.entries(groups).forEach(([cat,items])=>{category=cat;Object.assign(qty,items)});renderCats();renderProducts();toast('Kit agregado')}
async function api(url,options){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...options});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Error');return d}
async function load(){try{const d=await api('/api/service-orders');orders=d.orders;render()}catch(e){ordersEl().innerHTML=`<div class="empty">${esc(e.message)}<br><small>Verifica PostgreSQL y vuelve a cargar.</small></div>`}}
function ordersEl(){return document.getElementById('orders')}
function activeOrder(o){return !['completed','cancelled'].includes(o.status)}
function render(){const q=search.value.trim().toLowerCase();let list=orders.filter(o=>!q||o.room.toLowerCase().includes(q));if(filter==='active')list=list.filter(activeOrder);else if(filter!=='all')list=list.filter(o=>o.status===filter);stats();ordersEl().innerHTML=list.length?list.map(card).join(''):'<div class="empty">No hay órdenes en esta vista.</div>'}
function stats(){sNew.textContent=orders.filter(o=>o.status==='new').length;sProgress.textContent=orders.filter(o=>['accepted','in_progress','delivered'].includes(o.status)).length;sUrgent.textContent=orders.filter(o=>activeOrder(o)&&o.priority==='urgent').length;const today=new Date().toDateString();sDone.textContent=orders.filter(o=>o.status==='completed'&&new Date(o.completed_at||o.updated_at).toDateString()===today).length}
const statusLabel={new:'NEW',accepted:'ACCEPTED',in_progress:'IN PROGRESS',delivered:'DELIVERED',completed:'COMPLETED',cancelled:'CANCELLED'};
function card(o){const items=(o.items||[]).map(i=>`<div class="item"><span>${esc(i.name)}</span><b>× ${i.quantity}</b></div>`).join('');let next='',label='';if(o.status==='new'){next='accepted';label='Accept'}else if(o.status==='accepted'){next='in_progress';label='Start'}else if(o.status==='in_progress'){next='delivered';label='Delivered'}else if(o.status==='delivered'){next='completed';label='Complete'};return `<article class="order ${o.priority}"><div class="order-head"><div><div class="room">${esc(o.room)}</div><div class="meta">${icons[o.category]||'📦'} ${esc(o.category)} · ${new Date(o.created_at).toLocaleString()}</div></div><span class="badge ${o.priority}">${o.priority}</span></div><div class="badge">${statusLabel[o.status]||o.status}</div><div class="items">${items}</div>${o.notes?`<div class="notes">${esc(o.notes)}</div>`:''}<div class="assignee">👤 ${esc(o.assigned_to||'Unassigned')}</div>${o.scheduled_for?`<div class="meta">⏰ ${new Date(o.scheduled_for).toLocaleString()}</div>`:''}<div class="actions">${next?`<button class="primary" onclick="advance(${o.id},'${next}')">${label}</button>`:''}<button class="secondary" onclick="historyOrder(${o.id})">History</button></div></article>`}
async function createOrder(e){e.preventDefault();const items=Object.entries(qty).filter(([,quantity])=>quantity>0).map(([name,quantity])=>({name,quantity}));if(!items.length)return toast('Agrega al menos un artículo');submitBtn.disabled=true;try{await api('/api/service-orders',{method:'POST',body:JSON.stringify({room:room.value,category,items,priority:priority.value,assignedTo:assignedTo.value,requestedBy:requestedBy.value,notes:notes.value,scheduledFor:scheduledFor.value||null})});e.target.reset();assignedTo.value='Runner';qty={};category='Kitchen';hideBedOpen=false;setupOccupancy='single';setupBed='king';closeCreate();toast('Orden creada');await load()}catch(err){toast(err.message)}finally{submitBtn.disabled=false}}
async function advance(id,status){const actor=employeeName||'Runner';try{await api(`/api/service-orders/${id}/status`,{method:'PATCH',body:JSON.stringify({status,actor})});toast('Orden actualizada');await load()}catch(e){toast(e.message)}}
async function historyOrder(id){try{const d=await api(`/api/service-orders/${id}`);alert(d.events.map(e=>`${new Date(e.created_at).toLocaleString()} · ${e.event_type.toUpperCase()} · ${e.actor||'System'}${e.note?'\n'+e.note:''}`).join('\n\n')||'No history')}catch(e){toast(e.message)}}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.status;render()});
const socket=io();socket.on('service-order:created',load);socket.on('service-order:updated',load);configureAccess();load();
</script>
</body></html>
