<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1726"><title>Centro de Control · Care OS</title><link rel="stylesheet" href="/css/control-center.css"></head><body>
<aside><a class="brand" href="/app">CARE<span>LUXURY CLEANING · OS</span></a><p class="eyebrow">STILL WATERS RESORT</p><nav id="navigation" aria-label="Vistas de control"><button data-view="overview" class="selected">01 <span>Centro de Control</span></button><button data-view="rooms">02 <span>Habitaciones</span></button><button data-view="inspections">03 <span>Inspecciones</span></button><button data-view="requests">04 <span>Solicitudes</span></button><button data-view="tasks">05 <span>Pendientes</span></button><button data-view="shift">06 <span>Responsables y relevo</span></button><button data-view="modules">07 <span>Administración</span></button><button data-view="history">08 <span>Historial</span></button></nav><a class="return" href="/app">← Volver a Care OS</a><small>El encargado resuelve.<br>Dirección revisa excepciones.</small></aside>
<main><header><div><p class="eyebrow">CARE OS / OPERACIÓN DIARIA</p><h1 id="title">Centro de Control</h1><p id="identity">Verificando acceso…</p></div><div class="tools"><label>Fecha del turno<input id="date" type="date" required></label><button id="refresh" type="button">Actualizar</button><button id="print" type="button">Imprimir</button></div></header>
<div id="message" role="status" aria-live="polite"></div><section id="content" aria-busy="true"><div class="empty">Cargando datos del turno…</div></section><footer><span id="updated">Sin datos cargados</span><span>Care Luxury Cleaning LLC</span></footer></main>
<dialog id="taskDialog"><form id="taskForm"><div class="dialog-head"><h2>Nuevo pendiente</h2><button type="button" id="cancelTask" aria-label="Cerrar">×</button></div><label>Tarea<input name="title" maxlength="160" required placeholder="Ej. Preparar blancos para edificio C"></label><div class="formgrid"><label>Responsable<input name="owner" list="employees" maxlength="120" required></label><label>Unidad / área<input name="room" maxlength="80"></label><label>Prioridad<select name="priority"><option value="normal">Normal</option><option value="high">Alta</option><option value="urgent">Urgente</option></select></label><label>Hora límite (hora de este dispositivo)<input name="dueAt" type="datetime-local"></label></div><label>Instrucciones<textarea name="note" maxlength="2000"></textarea></label><p id="taskError" role="alert"></p><button class="primary" type="submit">Guardar pendiente</button></form></dialog><datalist id="employees"></datalist>
<script src="/socket.io/socket.io.js"></script><script src="/js/resilience.js?v=reliability-v2"></script><script src="/js/control-center.js"></script></body></html>
